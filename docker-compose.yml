# =====================================================================
# DOCKER COMPOSE — Run the entire application stack with ONE command.
# =====================================================================
#
# WHAT IS DOCKER COMPOSE?
#   A tool that defines and runs multi-container Docker applications.
#   Instead of running each service separately:
#     docker run postgres ...
#     docker run redis ...
#     docker run taskflow ...
#   You define everything in this file and run: docker-compose up
#
# WHAT IS DOCKER?
#   Docker packages your app + its dependencies into a "container".
#   A container is like a lightweight virtual machine:
#     - Has its own filesystem, network, processes
#     - But shares the host OS kernel (much lighter than a VM)
#     - Runs the same everywhere: your laptop, server, cloud
#
# WHY DOCKER?
#   "It works on my machine" problem SOLVED.
#   You define exactly what your app needs, and Docker creates
#   that exact environment every time, everywhere.
#
# HOW TO USE:
#   Start everything:    docker-compose up -d
#   See logs:            docker-compose logs -f
#   Stop everything:     docker-compose down
#   Stop + delete data:  docker-compose down -v
#
# SERVICES DEFINED:
#   1. postgres — PostgreSQL database (production DB)
#   2. redis — Redis cache (for caching + rate limiting)
#   3. app — Our Spring Boot TaskFlow application
# =====================================================================

services:
  # ---- POSTGRESQL DATABASE ----
  # PostgreSQL = production-grade relational database
  # Runs as its own process, data survives app restarts
  # Used by: Instagram, Spotify, Reddit, Gitlab
  postgres:
    image: postgres:16-alpine          # Official PostgreSQL image (alpine = smaller size)
    container_name: taskflow-postgres
    environment:
      POSTGRES_DB: taskflow            # Creates a database named "taskflow" on first start
      POSTGRES_USER: taskflow          # Username to connect
      POSTGRES_PASSWORD: taskflow123   # Password (change this in production!)
    ports:
      - "5432:5432"                    # host:container — access from localhost:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data  # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- ADMINER — Database Visual UI ----
  # Adminer = web-based tool to SEE your database tables and data
  # Access at: http://localhost:8090
  # Login with: System=PostgreSQL, Server=postgres, User=taskflow, Password=taskflow123, DB=taskflow
  #
  # WHY Adminer?
  #   H2 had a built-in console. PostgreSQL doesn't.
  #   Adminer gives you the same ability — browse tables, run SQL, see data.
  adminer:
    image: adminer:latest
    container_name: taskflow-adminer
    ports:
      - "8090:8080"                    # Access at http://localhost:8090
    depends_on:
      - postgres

  # ---- REDIS CACHE ----
  # Redis = in-memory data store (super fast!)
  # Used for: caching, rate limiting, session storage
  redis:
    image: redis:7-alpine
    container_name: taskflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# ---- VOLUMES ----
# Named volumes persist data even when containers are stopped/removed.
# Without volumes, all PostgreSQL data is lost when container stops!
volumes:
  postgres-data:
